name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first run only)
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak
            cp pubspec.yaml /tmp/pubspec_bak.yaml
            flutter create . --platforms=android --org com.kasi.ttdhelper --project-name ttd_helper
            rm -rf lib && cp -r /tmp/lib_bak lib
            cp /tmp/pubspec_bak.yaml pubspec.yaml
            rm -rf test
          fi

      - name: Patch Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          grep -q 'allowBackup' "$M" || sed -i 's|<application|<application android:allowBackup="false"|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="TTD Helper"|' "$M"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ttd-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk

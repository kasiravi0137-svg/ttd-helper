name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  APP_NAME: TTD Helper

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first run only)
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak
            cp pubspec.yaml /tmp/pubspec_bak.yaml
            flutter create . --platforms=android --org com.kasi.ttdhelper --project-name ttd_helper
            rm -rf lib && cp -r /tmp/lib_bak lib
            cp /tmp/pubspec_bak.yaml pubspec.yaml
            rm -rf test
          fi

      - name: Patch Android manifest and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          grep -q 'RECEIVE_SMS' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.RECEIVE_SMS"/>\n    <application|' "$M"
          grep -q 'allowBackup' "$M" || sed -i 's|<application|<application android:allowBackup="false"|' "$M"
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APP_NAME\"|" "$M"
          grep -n 'android:label' "$M"

      - name: SMS OTP reader (native)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          PKG=$(grep -m1 '^package ' "$F" | awk '{print $2}')
          cat > "$F" <<EOF
          package $PKG

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.Build
          import android.provider.Telephony
          import com.google.android.gms.auth.api.phone.SmsRetriever
          import com.google.android.gms.common.api.CommonStatusCodes
          import com.google.android.gms.common.api.Status
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var sink: EventChannel.EventSink? = null
              private var receiver: BroadcastReceiver? = null

              private var consentReceiver: BroadcastReceiver? = null

              // Permission-free route: Google asks the user to share just the one OTP message.
              private fun startConsent(): String {
                  try {
                      SmsRetriever.getClient(this).startSmsUserConsent(null)
                      if (consentReceiver != null) return "started (receiver already on)"
                      val r = object : BroadcastReceiver() {
                          override fun onReceive(c: Context?, i: Intent?) {
                              if (i == null || i.action != SmsRetriever.SMS_RETRIEVED_ACTION) return
                              val ex = i.extras ?: return
                              val st = ex.get(SmsRetriever.EXTRA_STATUS) as? Status ?: return
                              if (st.statusCode == CommonStatusCodes.SUCCESS) {
                                  val ci = ex.getParcelable<Intent>(SmsRetriever.EXTRA_CONSENT_INTENT)
                                  if (ci != null) {
                                      try { startActivityForResult(ci, 88) } catch (e: Exception) {}
                                  }
                              }
                          }
                      }
                      val f = IntentFilter(SmsRetriever.SMS_RETRIEVED_ACTION)
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(r, f, SmsRetriever.SEND_PERMISSION, null, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(r, f, SmsRetriever.SEND_PERMISSION, null)
                      }
                      consentReceiver = r
                      return "started"
                  } catch (e: Exception) {
                      return "error: " + e.toString()
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 88 && res == RESULT_OK && data != null) {
                      val m = data.getStringExtra(SmsRetriever.EXTRA_SMS_MESSAGE)
                      if (m != null) sink?.success(m)
                  } else if (req == 88) {
                      sink?.success("consent dialog closed without message")
                  }
              }

              private fun allowed() =
                  checkSelfPermission(Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED

              private fun register() {
                  if (receiver != null || !allowed()) return
                  val r = object : BroadcastReceiver() {
                      override fun onReceive(c: Context?, i: Intent?) {
                          if (i == null) return
                          for (m in Telephony.Sms.Intents.getMessagesFromIntent(i)) {
                              sink?.success(m.messageBody ?: "")
                          }
                      }
                  }
                  val f = IntentFilter("android.provider.Telephony.SMS_RECEIVED")
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(r, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(r, f)
                  receiver = r
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val bm = flutterEngine.dartExecutor.binaryMessenger
                  MethodChannel(bm, "ttd/sms").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "hasPermission" -> result.success(allowed())
                          "consent" -> {
                              result.success(startConsent())
                          }
                          "request" -> {
                              requestPermissions(arrayOf(Manifest.permission.RECEIVE_SMS), 77)
                              result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  EventChannel(bm, "ttd/sms_events").setStreamHandler(object : EventChannel.StreamHandler {
                      override fun onListen(args: Any?, events: EventChannel.EventSink?) {
                          sink = events
                          register()
                      }
                      override fun onCancel(args: Any?) {
                          sink = null
                      }
                  })
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  register()
              }

              override fun onDestroy() {
                  consentReceiver?.let { unregisterReceiver(it) }
                  consentReceiver = null
                  receiver?.let { unregisterReceiver(it) }
                  receiver = null
                  super.onDestroy()
              }
          }
          EOF
          head -5 "$F"
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$G" ]; then
              if [[ "$G" == *.kts ]]; then
                printf '\ndependencies {\n    implementation("com.google.android.gms:play-services-auth-api-phone:18.1.0")\n}\n' >> "$G"
              else
                printf "\ndependencies {\n    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'\n}\n" >> "$G"
              fi
              tail -4 "$G"
              break
            fi
          done

      - name: App icon (from icon.png in the repo root)
        run: |
          if [ -f icon.png ]; then
            CONV=$(command -v magick || command -v convert || true)
            if [ -z "$CONV" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
              CONV=convert
            fi
            R=android/app/src/main/res
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              mkdir -p "$R/mipmap-$d"
              $CONV icon.png -resize ${s}x${s} "$R/mipmap-$d/ic_launcher.png"
            done
            ls -la $R/mipmap-*/ic_launcher.png
          else
            echo "icon.png not found, keeping the default icon"
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ttd-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          overwrite: true

      # Permanent download link (no GitHub login needed, stays until the next build replaces it)
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TTD-Helper.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest TTD-Helper.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "TTD Helper (latest APK)" --notes "Latest build. Download TTD-Helper.apk and install."

